<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Dashboard{% endblock %} · {{ core.PROJECT_NAME }}</title>
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/style.css">
</head><body>
<header><nav>
  <a class="brand" href="/">{{ core.PROJECT_NAME }}</a>
  <a href="/discussion">Discussion{% if nav_waiting %}<span class="badge" title="waiting on you">{{ nav_waiting }}</span>{% endif %}</a>
  <a href="/labs">Labs</a>
  <a href="/wiki">Wiki</a>
  <a href="/notes">Notes</a>
  <a href="/refs">Refs</a>
  <a href="/skills">Skills</a>
  <a href="/agents">Agents{% if nav_active %} <span class="dot run" title="agent working"></span>{% elif nav_pending and not nav_alive %} <span class="dot stopped" title="threads queued but watcher not running"></span>{% elif nav_paused %} <span class="dot paused" title="paused"></span>{% endif %}</a>
  <a href="/browse/src">Src</a>
  <form action="/search"><input name="q" placeholder="Search…" value="{{ q|default('') }}"></form>
</nav></header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/vendor/katex/katex.min.js"></script>
{% block scripts %}{% endblock %}
<script src="/static/app.js"></script>
</body></html>
